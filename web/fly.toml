# Fly.io deployment config. `fly launch` reads this to create/update the app.
# `app` must be globally unique across Fly — change it if the name is taken.
app = "rigi-web"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[build.args]
VITE_API_URL = "https://rigi-api.fly.dev"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
